name: Bug Report
description: Report a bug or unexpected behavior in clipm
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below so we can reproduce and fix it quickly.
        If this is a **security vulnerability**, please do **not** open a public issue — report it via the [Security tab](https://github.com/tubook/clipm/security).

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (x64)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: e.g. macOS 15.2 / Windows 11 24H2
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: clipm Version
      placeholder: e.g. v1.0.2 (or commit hash if built from source)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Copy '...'
        2. Press hotkey '...'
        3. See error / unexpected behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any relevant console output or drag-and-drop screenshots here.
    validations:
      required: false
