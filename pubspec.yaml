name: clipm
description: A local-first, keyboard-driven, Omarchy-styled desktop clipboard history manager.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (Drift + SQLite with FTS5 enabled via sqlite3_flutter_libs)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.6.0

  # Desktop System Integration
  window_manager: ^0.4.3
  hotkey_manager: ^0.2.3
  tray_manager: ^0.3.2

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
